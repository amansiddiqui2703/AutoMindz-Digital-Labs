name = "keep-alive-pinger"
main = "src/index.js"
compatibility_date = "2023-10-02"

[triggers]
crons = ["*/5 * * * *"] # Runs every 5 minutes so Render never sleeps!

[vars]
PING_URLS = "https://new-outreach-system.onrender.com/health,https://new-outreach-system.onrender.com/api/v1/health,https://automindzdigitallabs.online/"

[[kv_namespaces]]
binding = "PING_RESULTS"
id = "REPLACE_WITH_YOUR_KV_ID"
