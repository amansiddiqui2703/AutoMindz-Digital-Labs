name: AutoMindz CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: |
          server/package-lock.json
          client/package-lock.json

    # Build Server
    - name: Install Server Dependencies
      run: npm install
      working-directory: ./server

    # Build Client
    # react-quill@2 has a peer dep conflict with React 19, so we need --legacy-peer-deps
    - name: Install Client Dependencies
      run: npm install --legacy-peer-deps
      working-directory: ./client

    - name: Lint Client
      run: npm run lint
      working-directory: ./client

    - name: Build Client
      run: npm run build
      working-directory: ./client
      env:
        VITE_API_BASE_URL: '/api/v1'

    - name: Test Client
      run: node --test tests/seo_aeo_geo.test.js tests/ga4.test.js
      working-directory: ./client

    - name: Test Server
      run: npm test
      working-directory: ./server
      env:
        NODE_ENV: test
        CI: true
        MONGODB_URI: mongodb://127.0.0.1:27017/automindz_ci_test
        ENCRYPTION_KEY: '1234567890123456789012345678901234567890123456789012345678901234'
        JWT_SECRET: 'ci-test-jwt-secret-for-actions-run'
        REFRESH_TOKEN_SECRET: 'ci-test-refresh-secret-for-actions'
        APP_URL: 'http://localhost:5173'
        SERVER_URL: 'http://localhost:5000'
        USE_IN_MEMORY_QUEUE: 'true'

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Server Image
      uses: docker/build-push-action@v6
      with:
        context: ./server
        push: false
        tags: automindz-server:latest

    - name: Build Client Image
      uses: docker/build-push-action@v6
      with:
        context: ./client
        push: false
        tags: automindz-client:latest
