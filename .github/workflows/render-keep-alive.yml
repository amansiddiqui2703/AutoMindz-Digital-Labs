name: Render 24/7 Keep-Alive Robot

on:
  schedule:
    # Runs every 5 minutes so Render free-tier never goes to sleep (15 min inactivity timer)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-render:
    name: Ping AutoMindz on Render
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Render Backend & Frontend Endpoints
        run: |
          echo "🤖 Keep-Alive Robot waking up Render Web Service..."

          # Primary Render Service URL (The actual service that goes to sleep)
          RENDER_URL="https://new-outreach-system.onrender.com/health"
          RENDER_API_URL="https://new-outreach-system.onrender.com/api/v1/health"
          FRONTEND_URL="https://automindzdigitallabs.online/"

          echo "Pinging primary Render backend: $RENDER_URL at $(date -u)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 45 --retry 3 --retry-delay 5 "$RENDER_URL" || true)
          echo "Render Backend Status Code: $STATUS"

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "✅ Render backend is awake and healthy!"
          else
            echo "⚠️ Primary endpoint returned $STATUS, pinging API alias: $RENDER_API_URL..."
            STATUS_ALIAS=$(curl -s -o /dev/null -w "%{http_code}" -m 45 "$RENDER_API_URL" || true)
            echo "Render API Alias Status Code: $STATUS_ALIAS"
          fi

          echo "Pinging Frontend: $FRONTEND_URL"
          STATUS_FRONTEND=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "$FRONTEND_URL" || true)
          echo "Frontend Status Code: $STATUS_FRONTEND"

          echo "🎉 Keep-alive check completed successfully."

