<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="brevoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="panelGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadowBrevo" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#brevoGrad)"/>

  <rect x="50" y="45" width="230" height="28" rx="14" fill="#eff6ff" opacity="0.95"/>
  <text x="65" y="64" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#2563eb" letter-spacing="1">★ DELIVERABILITY ARCHITECTURE</text>

  <text x="50" y="115" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff">Why AutoMindz Beats Brevo for Cold Email</text>
  <text x="50" y="148" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#93c5fd">Dedicated Outbound Mailboxes vs. Opt-In Newsletter SMTP</text>

  <g filter="url(#shadowBrevo)">
    <rect x="50" y="180" width="330" height="220" rx="16" fill="url(#panelGrad2)"/>
    <rect x="50" y="180" width="330" height="6" rx="3" fill="#16a34a"/>
    <text x="75" y="218" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="#15803d">AutoMindz Outbound</text>
    <text x="75" y="238" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748b">100% Cold Outreach Compliant</text>

    <text x="75" y="275" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">✓ Primary Gmail &amp; Workspace APIs</text>
    <text x="75" y="305" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">✓ Rotates sender limits (40-50/day)</text>
    <text x="75" y="335" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">✓ Instant reply auto-stop sequence</text>
    <text x="75" y="375" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#16a34a">99.4% Inbox Placement</text>
  </g>

  <g filter="url(#shadowBrevo)">
    <rect x="420" y="180" width="330" height="220" rx="16" fill="url(#panelGrad2)"/>
    <rect x="420" y="180" width="330" height="6" rx="3" fill="#dc2626"/>
    <text x="445" y="218" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="#b91c1c">Brevo (Sendinblue)</text>
    <text x="445" y="238" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748b">Marketing Newsletters Only</text>

    <text x="445" y="275" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#64748b">✗ Cold email strictly prohibited</text>
    <text x="445" y="305" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#64748b">✗ Account suspension risk on cold lists</text>
    <text x="445" y="335" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#64748b">✗ Shared IP deliverability pools</text>
    <text x="445" y="375" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#dc2626">Promotions / Spam Tab Risk</text>
  </g>
</svg>

