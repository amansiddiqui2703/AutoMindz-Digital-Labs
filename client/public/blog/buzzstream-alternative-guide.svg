<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="buzzGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadowBuzz" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#buzzGrad)"/>
  
  <rect x="50" y="45" width="200" height="28" rx="14" fill="#eff6ff" opacity="0.95"/>
  <text x="65" y="64" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#2563eb" letter-spacing="1">★ SOFTWARE COMPARISON</text>

  <text x="50" y="115" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff">Best BuzzStream Alternative (2026)</text>
  <text x="50" y="148" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#93c5fd">Link Building CRM vs. Multi-Inbox Outreach Engine</text>

  <g filter="url(#shadowBuzz)">
    <rect x="50" y="180" width="330" height="220" rx="16" fill="url(#panelGrad)"/>
    <rect x="50" y="180" width="330" height="6" rx="3" fill="#2563eb"/>
    <text x="75" y="218" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="#1e3a8a">AutoMindz Outreach</text>
    <text x="75" y="238" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748b">Modern Outbound Engine</text>

    <text x="75" y="275" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">✓ Multi-Inbox Sender Fleet</text>
    <text x="75" y="305" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">✓ Gemini AI Personalization</text>
    <text x="75" y="335" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">✓ Domain Crawler Email Finder</text>
    <text x="75" y="375" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#16a34a">Free Forever Tier Available</text>
  </g>

  <g filter="url(#shadowBuzz)">
    <rect x="420" y="180" width="330" height="220" rx="16" fill="url(#panelGrad)"/>
    <rect x="420" y="180" width="330" height="6" rx="3" fill="#64748b"/>
    <text x="445" y="218" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="#475569">BuzzStream</text>
    <text x="445" y="238" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748b">Legacy PR Database</text>

    <text x="445" y="275" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#64748b">✗ Expensive per-seat pricing</text>
    <text x="445" y="305" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#64748b">✗ No multi-inbox fleet rotation</text>
    <text x="445" y="335" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#64748b">✗ Static templates, no native LLM</text>
    <text x="445" y="375" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#dc2626">Starts at $24 - $999/mo</text>
  </g>
